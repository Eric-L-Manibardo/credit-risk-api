name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (lockfile)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Typecheck
        run: uv run mypy src/
      - name: Tests
        run: uv run pytest tests/

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t credit-risk-api:ci .
